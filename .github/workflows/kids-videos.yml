name: Refresh VUE Kids videos
on:
  schedule:
    - cron: "17 0 * * *"   # daily, 03:17 Riyadh time
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/build_kids_videos.py kids/videos.json
      - name: Commit if changed
        run: |
          if git diff --quiet -- kids/videos.json; then echo "no change"; exit 0; fi
          git config user.name "vue-kids-bot"
          git config user.email "vue-kids-bot@users.noreply.github.com"
          git add kids/videos.json
          git commit -m "Daily kids videos $(date -u +%F)"
          git push
