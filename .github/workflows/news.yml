name: Refresh VUE news (general + leagues)
on:
  schedule:
    - cron: "8,38 * * * *"   # every 30 minutes (fresh breaking news)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/build_news.py
      - run: python3 scripts/build_league_news.py
      - name: Visits / downloads snapshot (same-origin, so the counter shows even where the counter service is blocked)
        run: |
          get() { for i in 1 2 3 4 5; do r=$(curl -fsS -m 20 "https://countapi.mileshilliard.com/api/v1/get/$1" 2>/dev/null | python3 -c "import json,sys;print(json.load(sys.stdin)['value'])" 2>/dev/null) && [ -n "$r" ] && { echo "$r"; return; }; sleep 6; done; }
          v=$(get vue-tv-sa-site-visits); d=$(get vue-tv-sa-app-downloads)
          if [ -n "$v" ] && [ -n "$d" ]; then printf '{"visits":%s,"downloads":%s}\n' "$v" "$d" > stats.json; fi
      - name: Commit if changed
        run: |
          if git diff --quiet -- news stats.json; then echo "no change"; exit 0; fi
          git config user.name "vue-news-bot"
          git config user.email "vue-news-bot@users.noreply.github.com"
          git add news stats.json
          git commit -m "News $(date -u +%FT%H:%M)"
          git pull --rebase -q origin main || true
          git push
