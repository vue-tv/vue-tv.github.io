name: Refresh VUE news ticker
on:
  schedule:
    - cron: "23 */2 * * *"   # every 2 hours
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/build_news.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- news; then echo "no change"; exit 0; fi
          git config user.name "vue-news-bot"
          git config user.email "vue-news-bot@users.noreply.github.com"
          git add news
          git commit -m "News $(date -u +%FT%H:%M)"
          git pull --rebase -q origin main || true
          git push
